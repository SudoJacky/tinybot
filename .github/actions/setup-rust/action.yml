name: Set up cached Rust
description: Use the same Rust toolchain and dependency cache for CI and releases
inputs:
  target:
    description: Rust target triple
    required: true
  cache-key:
    description: Separate test and release dependency caches
    default: test
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.98.1
        targets: ${{ inputs.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri -> target
        shared-key: ${{ runner.os }}-${{ inputs.target }}-${{ inputs.cache-key }}
        cache-on-failure: true
