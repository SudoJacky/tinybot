name: Bug report
description: Report a reproducible problem with Tinybot.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Tinybot. Please search existing issues before submitting a new report.

  - type: input
    id: tinybot-version
    attributes:
      label: Tinybot version
      description: Find this in Tinybot's About dialog or release information.
      placeholder: "0.4.10"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected Tinybot to do.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Logs and screenshots
      description: Add relevant logs or screenshots. Remove API keys, credentials, and private data first.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Include anything else that may help us investigate.
    validations:
      required: false

  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
