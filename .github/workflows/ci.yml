name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test release tooling
        run: node --test .github/scripts/windows-release.test.mjs .github/scripts/customize-updater-manifest.test.mjs .github/scripts/resolve-release-build.test.mjs

      - name: Test README freshness tooling
        run: node --test .github/scripts/readme-freshness.test.mjs

      - name: Check module README freshness
        run: npm run readme:check

      - name: Test engineering documentation freshness tooling
        run: node --test .github/scripts/docs-freshness.test.mjs

      - name: Check engineering documentation freshness
        run: npm run docs:check

      - name: Run frontend analysis gate
        run: npm run analyze:frontend:ci

      - name: Upload frontend analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-analysis
          path: tools/frontend-analysis/reports/latest/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_HTTP_TIMEOUT: "120"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/setup-rust
        with:
          target: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: npm ci
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked --lib -- --test-threads=4
      - name: Verify build version
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node .github/scripts/check-release-version.mjs "v$version"
      - name: Build signed Windows installer
        if: github.ref == 'refs/heads/master'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --ci --bundles nsis --target x86_64-pc-windows-msvc -- --locked
      - name: Save signed installer for this commit
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Preserve the existing required check name for branch protection.
  desktop:
    if: always()
    needs: [frontend, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: test "$FRONTEND_RESULT" = success && test "$WINDOWS_RESULT" = success
