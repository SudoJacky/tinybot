name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        description: Exact commit to validate before release
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify application versions
        run: node .github/scripts/check-release-version.mjs
      - name: Test CI, release, documentation, and ripgrep tooling
        run: node --test .github/scripts/*.test.mjs tools/ripgrep/prepare.test.mjs
      - name: Check module README freshness
        run: node .github/scripts/readme-freshness.mjs check
      - name: Check engineering documentation freshness
        run: node .github/scripts/docs-freshness.mjs check
      - name: Determine required checks
        id: scope
        env:
          CI_FULL: ${{ inputs.commit != '' || github.event_name == 'workflow_dispatch' }}
        run: node .github/scripts/ci-scope.mjs detect

  frontend:
    needs: checks
    if: needs.checks.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend analysis gate
        run: npm run analyze:frontend:ci

      - name: Upload frontend analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-analysis
          path: tools/frontend-analysis/reports/latest/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    needs: checks
    if: needs.checks.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_HTTP_TIMEOUT: "120"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-rust
        with:
          target: x86_64-pc-windows-msvc
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Prepare bundled ripgrep
        run: node tools/ripgrep/prepare.mjs x86_64-pc-windows-msvc
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked --lib -- --test-threads=4

  # Preserve the existing required check name for branch protection.
  desktop:
    if: always()
    needs: [checks, frontend, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require all checks to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-scope.mjs check
