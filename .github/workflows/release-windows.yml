name: Release Windows x64

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "v<semver> tag to create or reuse at the current master commit"
        required: true
        type: string
      release_notes:
        description: "Custom What's new notes; leave blank to generate them from GitHub"
        required: false
        type: string
      display_notes:
        description: "Optional highlighted Before you update notice"
        required: false
        type: string

permissions:
  contents: read

# Serialize releases, including updates to the shared latest release pointer.
concurrency:
  group: release-windows-x64
  cancel-in-progress: false

jobs:
  release-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_HTTP_TIMEOUT: "120"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    outputs:
      commit: ${{ steps.source.outputs.commit }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify release version
        run: node .github/scripts/check-release-version.mjs "$env:RELEASE_TAG"

      - name: Verify release source and tag
        id: source
        shell: pwsh
        run: |
          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit on master"
          }
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve release commit" }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          $tagStatus = $LASTEXITCODE
          if ($tagStatus -eq 0) {
            $tagCommit = git rev-parse "refs/tags/${env:RELEASE_TAG}^{commit}"
            if ($LASTEXITCODE -ne 0) { throw "Could not resolve release tag" }
            if ($tagCommit -ne $headCommit) {
              throw "Release tag $env:RELEASE_TAG already points to a different commit"
            }
          } elseif ($tagStatus -ne 1) {
            throw "Could not check release tag"
          }
          "commit=$headCommit" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          target: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Test release tooling
        run: node --test .github/scripts/windows-release.test.mjs .github/scripts/customize-updater-manifest.test.mjs

      - name: Run frontend tests
        run: npm test

      - name: Test frontend build tooling
        run: npm run test:frontend-analysis

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run updater tests
        working-directory: src-tauri
        run: cargo test --locked --lib desktop::update::tests -- --test-threads=1

      - name: Build signed Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --ci --bundles nsis --target x86_64-pc-windows-msvc -- --locked

      - name: Prepare and validate updater artifacts
        run: node .github/scripts/windows-release.mjs prepare src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis release-artifacts

      - name: Save signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: release-artifacts/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  publish:
    needs: release-windows-x64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      RELEASE_COMMIT: ${{ needs.release-windows-x64.outputs.commit }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPDATE_DISPLAY_NOTES: ${{ inputs.display_notes }}
      UPDATE_RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-windows-x64.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-release
          path: release-artifacts

      - name: Ensure release tag matches the built commit
        shell: bash
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            if [ "$tag_commit" != "$RELEASE_COMMIT" ]; then
              echo "Release tag $RELEASE_TAG points to $tag_commit, expected $RELEASE_COMMIT" >&2
              exit 1
            fi
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            git tag "$RELEASE_TAG" "$RELEASE_COMMIT"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish validated updater artifacts
        run: node .github/scripts/windows-release.mjs publish release-artifacts
