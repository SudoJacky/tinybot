    <circle cx="1127" cy="258" r="244" fill="none" stroke="#cc785c" stroke-width="2" opacity=".16"/>
    <circle cx="1127" cy="258" r="206" fill="none" stroke="#141413" stroke-width="2" opacity=".08" stroke-dasharray="3 13"/>
