<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">Tinybot — Personal AI. Native tools.</title>
  <desc id="desc">README banner for Tinybot, a lightweight desktop AI assistant with native tools and plugins.</desc>
  <defs>
    <clipPath id="frame">
      <rect width="1440" height="500" rx="32"/>
    </clipPath>
  </defs>
