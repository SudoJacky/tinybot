    <text x="93" y="451" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2.2">CHAT   ·   TOOLS   ·   PLUGINS   ·   AUTOMATION</text>

